<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon titre </title>
    <style>
        .spiner{
            align-items: center;
            background-color: orangered;
            height: 200px;
            width: 200px;
            border-radius: 50%;
            justify-content: center;
            border: 25px solid white;
            border-top:20px solid indigo ;
            animation: ani 2.5s linear infinite;

            }
        @keyframes ani{
            to{
                transform: rotate(360deg);
            }
        }

    </style>
</head>
<body>
    <div  class="spiner"></div>
</body>
</html>
